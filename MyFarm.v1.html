<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل القطيع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--sf:#fff;--ink:#1f2a24;--mut:#5d6b63;--pri:#2f5d50;--pi:#fff;--acc:#c8932b;--bad:#a8432f;--ln:#d5dcd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--sf:#1d2722;--ink:#e8eee9;--mut:#9aaba1;--pri:#6fb39e;--pi:#10201a;--acc:#e0b050;--bad:#e5806a;--ln:#33423a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b17;--sf:#1d2722;--ink:#e8eee9;--mut:#9aaba1;--pri:#6fb39e;--pi:#10201a;--acc:#e0b050;--bad:#e5806a;--ln:#33423a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tajawal,Tahoma,system-ui,sans-serif}
.app{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0 10px;border-bottom:3px solid var(--pri)}
h1{margin:0;font-size:1.7rem;font-weight:800}
#cnt{font-size:1.7rem;font-weight:800;color:var(--pri)}
h2{margin:0 0 10px;font-size:1.1rem;font-weight:700}
nav{display:flex;gap:2px;overflow-x:auto;margin:10px 0 14px;border-bottom:1px solid var(--ln)}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;font-weight:500;padding:8px 14px;cursor:pointer}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--pri);color:var(--pi);border:0;border-radius:8px;padding:9px 18px;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ln);font-weight:500}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar select{width:auto}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:right;color:var(--mut);font-weight:500;border-bottom:2px solid var(--ln);padding:6px 8px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
td select{padding:3px 6px;width:auto}
.act{text-align:left}
.lk{background:none;border:0;color:var(--pri);font:inherit;cursor:pointer;padding:2px 6px}
.lk.bad{color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:18px}
tr.held td{background:rgba(168,67,47,.14);color:var(--bad);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.6rem;font-weight:800}
.stat span{color:var(--mut);font-size:.85rem}
.good{color:var(--pri)}.neg{color:var(--bad)}
ul.l{list-style:none;margin:0;padding:0}
ul.l li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.tag{font-size:.8rem;font-weight:700;border-radius:8px;padding:1px 8px;background:var(--acc);color:#1f2a24}
.tag.late{background:var(--bad);color:#fff}
.note{color:var(--mut);font-size:.88rem}
textarea{min-height:90px;direction:ltr;font-family:monospace;font-size:.8rem}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;text-align:center;display:none}
body.locked .app header{display:none}
.auth-card{max-width:560px;margin:24px auto}
.auth-card label{margin-top:10px}
.auth-card input{margin-top:4px}
#bn{margin-top:14px}
</style>
</head>
<body>
<div class="app">
<header><h1>سجل القطيع</h1><div id="cnt"></div></header>
<nav id="tabs"></nav>
<div id="bn"></div>
<main id="main"></main>
<datalist id="tags"></datalist>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ضع رابط مشروعك الأساسي فقط (بدون /rest/v1) والمفتاح العام هنا قبل الاستخدام.
// تسجيل الدخول برقم المستخدم يستخدم عنوانًا داخليًا بصيغة صحيحة (example.com)؛ عطّل تأكيد البريد في Supabase للاختبار فقط.
const SUPABASE_URL = "https://qupbthbpvatoicvvxcia.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_o3Qyv5c08AkY8lAD5bQsYw_ahRjebKq";
const K='sheep-app-v1';
let db={animals:[],health:[],births:[],money:[]};
try{const r=localStorage.getItem(K);if(r)db=Object.assign(db,JSON.parse(r))}catch(e){}
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>Number(n).toLocaleString('en',{maximumFractionDigits:3});
const CS=['animals','health','births','money'];
let rdb=null,inited=false,legacy=null,base={animals:{},health:{},births:{},money:{}},ready={};
function werr(e){toast(e&&e.code=='invalid_argument'?'ما عندك صلاحية التعديل، اطلب صلاحية مشارك (Contributor)':'تعذر الحفظ، تأكد من الاتصال')}
let sb=null, currentUser=null, pollHandle=null, saving=false;
function save(){
 if(!currentUser || !sb){
   try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}
   return;
 }
 if(saving)return;
 saving=true;
 (async()=>{
  try{
   for(const c of CS){
    const ids={};
    for(const x of db[c]){
     ids[x.id]=1;
     const row=Object.assign({},x,{user_id:currentUser.id});
     const serialized=JSON.stringify(row);
     if(base[c][x.id]!==serialized){
      const {error}=await sb.from(c).upsert(row,{onConflict:'id'});
      if(error)throw error;
      base[c][x.id]=serialized;
     }
    }
    for(const id of Object.keys(base[c])){
     if(!ids[id]){
      const {error}=await sb.from(c).delete().eq('id',id);
      if(error)throw error;
      delete base[c][id];
     }
    }
   }
   localStorage.setItem(K,JSON.stringify(db));
   toast('تم الحفظ والمزامنة');
  }catch(e){console.error(e);toast('خطأ الحفظ: '+(e.message||JSON.stringify(e)));}
  finally{saving=false;}
 })();
}
async function loadCloud(){
 for(const c of CS){
  const {data,error}=await sb.from(c).select('*').order('id');
  if(error)throw error;
  db[c]=data||[];
  base[c]={};
  db[c].forEach(x=>base[c][x.id]=JSON.stringify(x));
 }
 localStorage.setItem(K,JSON.stringify(db));
 refresh();
}
async function connect(){
 if(pollHandle)clearInterval(pollHandle);
 await loadCloud();
 pollHandle=setInterval(async()=>{
  if(!currentUser || saving || document.hidden)return;
  try{
   for(const c of CS){
    const {data,error}=await sb.from(c).select('*');
    if(error)throw error;
    const incoming=data||[];
    const incomingIds=new Set(incoming.map(x=>x.id));
    // Avoid overwriting a form while the user is editing it.
    const active=document.activeElement;
    const typing=active&&/^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)&&$('#main').contains(active);
    if(!typing){
     db[c]=incoming;
     base[c]={};
     db[c].forEach(x=>base[c][x.id]=JSON.stringify(x));
    }
   }
   refresh();
  }catch(e){console.error(e);}
 },5000);
}
function showAuth(message=''){
 document.body.classList.add('locked');
 const e=$('#bn');
 e.innerHTML=`<div class="card auth-card"><h2>تسجيل الدخول — سجل القطيع</h2>
 <p class="note">سجّل الدخول بنفس الحساب على الآيفون والكمبيوتر حتى تتزامن البيانات.</p>
 <label>رقم المستخدم<input id="authNumber" inputmode="numeric" autocomplete="username" placeholder="مثال: 100001" maxlength="6"></label>
 <label style="margin-top:10px">كلمة المرور<input id="authPassword" type="password" autocomplete="current-password" placeholder="كلمة مرور قوية"></label>
 <div class="row"><button class="btn" onclick="login()">دخول</button><button class="btn alt" onclick="signup()">إنشاء حساب</button></div>
 ${message?`<p class="note">${E(message)}</p>`:''}</div>`;
 $('#tabs').style.display='none';$('#main').style.display='none';
}
function authEmailFromNumber(number){return 'user'+number+'@example.com';}
async function login(){
 const number=$('#authNumber').value.trim(),password=$('#authPassword').value;
 if(!/^\d{6}$/.test(number)||!password){showAuth('أدخل رقم المستخدم المكوّن من 6 أرقام وكلمة المرور.');return;}
 const {data,error}=await sb.auth.signInWithPassword({email:authEmailFromNumber(number),password});
 if(error){showAuth('تعذر الدخول. تأكد من رقم المستخدم وكلمة المرور.');return;}
 await onSignedIn(data.user);
}
async function signup(){
 const password=$('#authPassword').value;
 if(password.length<6){showAuth('اختر كلمة مرور من 6 أحرف على الأقل.');return;}
 const number=String(Math.floor(100000+Math.random()*900000));
 const {data,error}=await sb.auth.signUp({email:authEmailFromNumber(number),password});
 if(error){showAuth('تعذر إنشاء الحساب: '+error.message+' — جرّب مرة ثانية.');return;}
 if(!data.session){showAuth('رقم المستخدم المقترح: '+number+'. يلزم تعطيل تأكيد البريد الإلكتروني في إعدادات Supabase (Authentication > Providers > Email) لأن الدخول هنا برقم مستخدم، ثم إنشاء الحساب مرة ثانية.');return;}
 alert('تم إنشاء حسابك! رقم المستخدم: '+number+'\nاحتفظ بالرقم وكلمة المرور للدخول من الآيفون والكمبيوتر.');
 await onSignedIn(data.user);
}
async function logout(){
 if(pollHandle)clearInterval(pollHandle);
 await sb.auth.signOut();currentUser=null;
 db={animals:[],health:[],births:[],money:[]};
 showAuth('تم تسجيل الخروج.');
}
async function onSignedIn(user){
 currentUser=user;
 document.body.classList.remove('locked');
 $('#tabs').style.display='flex';$('#main').style.display='block';
 try{
  const local=JSON.parse(localStorage.getItem(K)||'{}');
  const {data:probe,error}=await sb.from('animals').select('id').limit(1);
  if(error)throw error;
  const {data:remoteHealth,error:e2}=await sb.from('health').select('id').limit(1);
  if(e2)throw e2;
  const {data:remoteBirths,error:e3}=await sb.from('births').select('id').limit(1);
  if(e3)throw e3;
  const {data:remoteMoney,error:e4}=await sb.from('money').select('id').limit(1);
  if(e4)throw e4;
  const remoteEmpty=!(probe||[]).length&&!(remoteHealth||[]).length&&!(remoteBirths||[]).length&&!(remoteMoney||[]).length;
  const localHas=CS.some(c=>Array.isArray(local[c])&&local[c].length);
  if(remoteEmpty&&localHas&&confirm('وجدت بيانات محفوظة محليًا. هل تريد نقلها إلى قاعدة البيانات المشتركة؟')){
   db={animals:local.animals||[],health:local.health||[],births:local.births||[],money:local.money||[]};
   for(const c of CS){base[c]={};db[c].forEach(x=>base[c][x.id]=JSON.stringify(Object.assign({},x,{user_id:user.id})))}
   // Force upload all local rows
   for(const c of CS){
    for(const x of db[c]){
     const {error}=await sb.from(c).upsert(Object.assign({},x,{user_id:user.id}),{onConflict:'id'});
     if(error)throw error;
    }
   }
  }
  await connect();
  render();
  bn();
 }catch(e){console.error(e);showAuth('تعذر الاتصال بقاعدة البيانات. تأكد من رابط المشروع والمفتاح وأن الجداول جاهزة.');}
}
function bn(){
 const e=$('#bn');if(!e)return;
 if(!currentUser){return;}
 e.innerHTML=`<div class="note">● متصل بحساب ${E(currentUser.email||'')} — المزامنة تلقائية تقريبًا كل 5 ثوانٍ <button class="lk" onclick="logout()">تسجيل الخروج</button></div>`;
}
function refresh(){const a=document.activeElement;const typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&$('#main').contains(a);
 if(typing){if($('#rows'))drawRows(tab);$('#cnt').textContent=db.animals.filter(isLive).length+' رأس';return}
 render()}
function bn(){const e=$('#bn');if(!e)return;
 const mig=rdb&&legacy&&CS.every(c=>ready[c]&&!db[c].length);
 e.innerHTML=!inited?'':!rdb?'<div class="note">البيانات محلية على هذا الجهاز فقط. افتح الرابط وأنت مسجل دخول بحساب Claude عشان تتزامن مع باقي الأجهزة.</div>':(mig?`<div class="card"><b>لقينا بيانات مسجلة على هذا الجهاز (${legacy.animals.length} راس).</b><div class="row"><button class="btn" onclick="migrate()">انقلها للقاعدة المشتركة</button></div></div>`:'<div class="note">● متزامن مباشرة بين الأجهزة</div>')}
async function migrate(){const L=legacy;legacy=null;toast('جاري النقل...');
 try{for(const c of CS){for(let i=0;i<L[c].length;i+=25){await Promise.all(L[c].slice(i,i+25).map(x=>rdb.collection(c).doc(x.id).set(x)))}}toast('تم نقل البيانات')}catch(e){legacy=L;werr(e)}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function age(b){if(!b)return'';const d=new Date(b),n=new Date();const m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(m<0)return'';if(m<12)return m+' شهر';const y=Math.floor(m/12),r=m%12;return y+' سنة'+(r?' و'+r+' شهر':'')}
const dayL=n=>n<0?'متأخر '+(-n)+' يوم':n==0?'اليوم':'بعد '+n+' يوم';

const TABS=[['sum','الملخص'],['animals','القطيع'],['health','الصحة'],['births','التكاثر'],['money','الحسابات']];
let tab='sum',edit={},Q={};
const HT=['تطعيم','علاج','مضاد طفيليات','تحليل','أخرى'];
const S={
animals:{t:'حيوان',f:[['tag','رقم أو علامة الحيوان','text',1],['sex','الجنس','sel',['أنثى','ذكر']],['birth','تاريخ الميلاد','date'],['breed','السلالة','text'],['dad','اسم أو رقم الأب','text'],['mom','اسم أو رقم الأم','text'],['weight','الوزن (كغ)','number'],['status','الحالة','sel',['موجود','مباع','مذبوح','نافق']],['note','ملاحظات','text']]},
health:{t:'سجل صحي',f:[['date','التاريخ','date',1],['tag','رقم الحيوان (فاضي = كل القطيع)','text'],['type','النوع','sel',HT],['name','اسم اللقاح أو الدواء','text'],['next','الموعد القادم','date'],['hold','مدة المنع من البيع والذبح (بالأيام، فاضي = بدون منع)','number'],['note','ملاحظات','text']]},
births:{t:'تلقيح أو ولادة',f:[['ewe','رقم النعجة','text',1],['ram','رقم الكبش','text'],['mate','تاريخ التلقيح','date'],['born','تاريخ الولادة الفعلي','date'],['n','عدد المواليد','number'],['note','ملاحظات','text']]},
money:{t:'عملية مالية',f:[['date','التاريخ','date',1],['kind','النوع','sel',['مصروف','دخل']],['cat','البند','sel',['علف','دواء وبيطري','عمالة','شراء أغنام','بيع أغنام','أخرى']],['amt','المبلغ (د.ك)','number',1],['note','ملاحظات','text']]}
};
const T={
animals:{h:['العلامة','الجنس','العمر','السلالة','الأب','الأم','الوزن','الحالة','تنبيه'],r:a=>[E(a.tag),E(a.sex),age(a.birth),E(a.breed),E(a.dad),E(a.mom),a.weight?E(a.weight)+' كغ':'',`<select onchange="setSt('${a.id}',this.value)">${S.animals.f[7][3].map(o=>`<option ${a.status==o?'selected':''}>${o}</option>`).join('')}</select>`,alerts(a)]},
health:{h:['التاريخ','الحيوان','النوع','الاسم','الموعد القادم','المنع'],r:h=>[E(h.date),h.tag?E(h.tag):'كل القطيع',E(h.type),E(h.name),h.next?E(h.next)+` <span class="tag${diff(h.next)<0?' late':''}">${dayL(diff(h.next))}</span>`:'',holdCell(h)]},
births:{h:['النعجة','الكبش','التلقيح','المتوقعة','الولادة','المواليد','الحالة'],r:b=>[E(b.ewe),E(b.ram),E(b.mate),b.mate?addDays(b.mate,150):'',E(b.born),b.n?E(b.n):'',b.born?'ولدت':b.mate?'حامل':'']},
money:{h:['التاريخ','النوع','البند','المبلغ','ملاحظات'],r:m=>[E(m.date),`<span class="${m.kind=='دخل'?'good':'neg'}">${E(m.kind)}</span>`,E(m.cat),fmt(m.amt||0)+' د.ك',E(m.note)]}
};
const sortKey={animals:a=>a.tag,health:h=>h.date,births:b=>b.mate||b.born||'',money:m=>m.date};

function go(k){tab=k;render();scrollTo(0,0)}
function formHTML(c){
 const s=S[c],r=edit[c]||{};
 const fields=s.f.map(([k,l,t,x])=>{
  const v=r[k]!=null?r[k]:(k=='date'&&!edit[c]?today():'');
  const inp=t=='sel'?`<select id="f_${k}">${x.map(o=>`<option ${v==o?'selected':''}>${o}</option>`).join('')}</select>`
   :`<input id="f_${k}" type="${t}" ${t=='number'?'step="any" inputmode="decimal"':''} ${(['tag','ewe','ram'].includes(k)&&c!='animals'||['dad','mom'].includes(k))?'list="tags"':''} value="${E(v)}">`;
  return `<label>${l}${t!='sel'&&x?' *':''}${inp}</label>`}).join('');
 return `<div class="card" id="formcard"><h2>${edit[c]?'تعديل':'إضافة'} ${s.t}</h2><div class="grid">${fields}</div><div class="row"><button class="btn" onclick="saveForm('${c}')">حفظ</button>${edit[c]?`<button class="btn alt" onclick="cancelEdit('${c}')">إلغاء</button>`:''}</div></div>`}
function saveForm(c){
 const o={};
 for(const [k,l,t,x] of S[c].f){let v=$('#f_'+k).value.trim();if(t!='sel'&&x&&!v){toast('عبّي الحقل: '+l);return}if(t=='number'&&v!=='')v=Number(v);o[k]=v}
 if(c=='animals'&&!edit[c]&&db.animals.some(a=>a.tag==o.tag)){toast('هالعلامة مسجلة من قبل');return}
 if(c=='animals'&&(!edit[c]||edit[c].status!=o.status)&&blocked(o,o.status))return;
 if(edit[c])Object.assign(edit[c],o);else db[c].push(Object.assign({id:uid()},o));
 edit[c]=null;save();render();toast('تم الحفظ')}
function ed(c,id){edit[c]=db[c].find(x=>x.id==id);render();$('#formcard').scrollIntoView()}
function cancelEdit(c){edit[c]=null;render()}
function del(c,id,b){
 if(b.dataset.s!='1'){b.dataset.s='1';b.textContent='تأكيد الحذف';setTimeout(()=>{b.dataset.s='';b.textContent='حذف'},3000);return}
 db[c]=db[c].filter(x=>x.id!=id);save();render()}
function setSt(id,v){const a=db.animals.find(x=>x.id==id);if(!a)return;if(blocked(a,v)){render();return}a.status=v;save();render()}
function rows(c){
 let a=db[c].slice();const q=(Q[c]||'').trim();
 if(q)a=a.filter(x=>JSON.stringify(x).includes(q));
 if(c=='animals'&&Q.st)a=a.filter(x=>x.status==Q.st);
 if(c=='animals'&&Q.al)a=a.filter(x=>isLive(x)&&(Q.al=='b'?nearBirth(x):holds(x).length));
 const k=sortKey[c];
 a.sort((x,y)=>c=='animals'?String(k(x)).localeCompare(String(k(y)),'ar',{numeric:true}):(k(x)<k(y)?1:-1));
 if(!a.length)return '<tr><td colspan="9" class="empty">لا توجد سجلات. أضف أول سجل من النموذج أعلاه.</td></tr>';
 return a.map(x=>`<tr${c=='animals'&&isLive(x)&&holds(x).length?' class="held"':''}>${T[c].r(x).map(v=>`<td>${v}</td>`).join('')}<td class="act"><button class="lk" onclick="ed('${c}','${x.id}')">تعديل</button><button class="lk bad" onclick="del('${c}','${x.id}',this)">حذف</button></td></tr>`).join('')}
function drawRows(c){$('#rows').innerHTML=rows(c)}
function listView(c){
 const st=c=='animals'?`<select onchange="Q.st=this.value;drawRows('animals')"><option value="">كل الحالات</option>${S.animals.f[7][3].map(o=>`<option ${Q.st==o?'selected':''}>${o}</option>`).join('')}</select><select onchange="Q.al=this.value;drawRows('animals')"><option value="">كل التنبيهات</option><option value="b" ${Q.al=='b'?'selected':''}>قريبة من الولادة</option><option value="h" ${Q.al=='h'?'selected':''}>ممنوعة من البيع والذبح</option></select>`:'';
 return formHTML(c)+`<div class="card"><div class="bar"><input type="search" placeholder="بحث" value="${E(Q[c]||'')}" oninput="Q['${c}']=this.value;drawRows('${c}')">${st}</div><div class="wrap"><table><thead><tr>${T[c].h.map(h=>`<th>${h}</th>`).join('')}<th></th></tr></thead><tbody id="rows">${rows(c)}</tbody></table></div></div>`}
function isLive(a){return a.status!='مباع'&&a.status!='نافق'&&a.status!='مذبوح'}
function holdEnd(h){const n=Math.round(Number(h.hold));return n>0&&h.date?addDays(h.date,n):''}
function holds(a){return db.health.map(h=>({e:holdEnd(h),h})).filter(x=>x.e&&diff(x.e)>=0&&(!x.h.tag||String(x.h.tag)==String(a.tag))).sort((p,q)=>p.e<q.e?1:-1)}
function holdCell(h){const e=holdEnd(h);if(!e)return'';return diff(e)>=0?`<span class="tag late">ممنوع حتى ${e}</span>`:`<span class="note">انتهى ${e}</span>`}
function nearBirth(a){return db.births.find(b=>b.mate&&!b.born&&String(b.ewe)==String(a.tag)&&diff(addDays(b.mate,150))<=30)}
function alerts(a){if(!isLive(a))return'';let o='';const hs=holds(a);if(hs.length)o+=`<span class="tag late">ممنوع البيع والذبح حتى ${hs[0].e}</span> `;const b=nearBirth(a);if(b){const n=diff(addDays(b.mate,150));o+=`<span class="tag">${n<0?'متأخرة على الولادة':n==0?'تولد اليوم':'تولد بعد '+n+' يوم'}</span>`}return o}
function blocked(a,v){if(v!='مباع'&&v!='مذبوح')return false;const h=holds(a);if(!h.length)return false;toast('ممنوع: الحيوان '+a.tag+' تحت فترة منع حتى '+h[0].e);return true}
function doneH(id){const h=db.health.find(x=>x.id==id);if(h){h.next='';save();render()}}
function sumView(){
 const live=db.animals.filter(isLive);const held=live.filter(a=>holds(a).length);
 const f=live.filter(a=>a.sex=='أنثى').length;
 const tot=k=>db.money.filter(x=>x.kind==k).reduce((s,x)=>s+(Number(x.amt)||0),0);
 const inc=tot('دخل'),exp=tot('مصروف'),net=inc-exp;
 const due=db.health.filter(h=>h.next&&diff(h.next)<=14).sort((a,b)=>a.next>b.next?1:-1);
 const preg=db.births.filter(b=>b.mate&&!b.born);
 const soon=preg.map(b=>Object.assign({e:addDays(b.mate,150)},b)).filter(b=>diff(b.e)<=30).sort((a,b)=>a.e>b.e?1:-1);
 const lamb=db.births.reduce((s,b)=>s+(Number(b.n)||0),0);
 return `<div class="stats"><div class="stat"><b>${live.length}</b><span>رأس موجود</span></div><div class="stat"><b>${f}</b><span>إناث</span></div><div class="stat"><b>${live.length-f}</b><span>ذكور</span></div><div class="stat"><b>${preg.length}</b><span>حوامل</span></div><div class="stat"><b>${lamb}</b><span>مواليد مسجلة</span></div><div class="stat"><b class="${net<0?'neg':'good'}">${fmt(net)}</b><span>الصافي (د.ك)</span></div></div>
 <div class="card"><h2>مواعيد صحية خلال 14 يوم</h2><ul class="l">${due.length?due.map(h=>`<li><span>${E(h.type)} ${E(h.name)} (${h.tag?'رقم '+E(h.tag):'كل القطيع'}) <span class="tag${diff(h.next)<0?' late':''}">${dayL(diff(h.next))}</span></span><button class="lk" onclick="doneH('${h.id}')">تمّ</button></li>`).join(''):'<li class="note">لا يوجد شي مستحق.</li>'}</ul></div>
 <div class="card"><h2>ولادات متوقعة خلال 30 يوم</h2><ul class="l">${soon.length?soon.map(b=>`<li><span>النعجة ${E(b.ewe)} (${b.e}) <span class="tag${diff(b.e)<0?' late':''}">${dayL(diff(b.e))}</span></span><button class="lk" onclick="go('births');ed('births','${b.id}')">سجّل الولادة</button></li>`).join(''):'<li class="note">لا توجد ولادات قريبة. الموعد المتوقع = تاريخ التلقيح + 150 يوم.</li>'}</ul></div>
 <div class="card"><h2>ممنوعة من البيع والذبح (${held.length})</h2><ul class="l">${held.length?held.slice(0,40).map(a=>`<li><span>رقم ${E(a.tag)}</span><span class="tag late">حتى ${holds(a)[0].e}</span></li>`).join('')+(held.length>40?`<li class="note">وغيرها ${held.length-40}، شوفها في تبويب القطيع.</li>`:''):'<li class="note">ما في حيوانات تحت منع.</li>'}</ul></div>
 <div class="card"><h2>الحسابات</h2><div class="note">دخل ${fmt(inc)} د.ك، مصروف ${fmt(exp)} د.ك</div></div>
 <div class="card"><h2>نسخة احتياطية</h2><p class="note">البيانات محفوظة في هذا المتصفح وعلى هذا الجهاز فقط. انسخ النسخة واحفظها في مكان آمن (ملاحظات أو رسالة لنفسك)، ولصقها هنا ترجع البيانات. الاستيراد يستبدل البيانات الحالية.</p><textarea id="bk" aria-label="النسخة الاحتياطية"></textarea><div class="row"><button class="btn" onclick="exp_()">عرض النسخة للنسخ</button><button class="btn alt" onclick="imp()">استيراد من النص</button></div></div>`}
function exp_(){const t=$('#bk');t.value=JSON.stringify(db);t.focus();t.select();toast('انسخ النص كامل واحفظه')}
function imp(){try{const o=JSON.parse($('#bk').value);if(!o||!Array.isArray(o.animals))throw 0;db={animals:o.animals||[],health:o.health||[],births:o.births||[],money:o.money||[]};save();render();toast('تم الاستيراد')}catch(e){toast('النص غير صالح')}}
function render(){bn();
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#tags').innerHTML=db.animals.map(a=>`<option value="${E(a.tag)}">`).join('');
 $('#cnt').textContent=db.animals.filter(isLive).length+' رأس';
 $('#main').innerHTML=tab=='sum'?sumView():listView(tab)}
render();
(async()=>{
 if(!window.supabase || !SUPABASE_URL.startsWith('https://') || SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')){
  showAuth('أولًا ضع Project URL وPublishable key في أعلى ملف HTML، ثم ارفع الملف إلى استضافة HTTPS.');
  return;
 }
 const cleanUrl=SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
 sb=window.supabase.createClient(cleanUrl,SUPABASE_PUBLISHABLE_KEY.trim());
 const {data:{session}}=await sb.auth.getSession();
 if(session) await onSignedIn(session.user); else showAuth();
 sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){currentUser=null;showAuth();}
 });
 inited=true;
})();
</script>
</body>
</html>
